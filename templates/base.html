<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}집콕세이프{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('fire_safety.checklist') }}">🏠 집콕세이프</a>
    <nav>
      <a href="{{ url_for('fire_safety.checklist') }}">안전 체크</a>
      <a href="{{ url_for('fire_safety.history') }}">변화 기록</a>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages() %}
      {% for message in messages %}<p class="flash">{{ message }}</p>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
